name: Calling Reusable Workflows
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Input description"
        type: string
        default: "Biswaranjan"
        required: false
jobs:
  calling-a-reusable-wf:
    uses: biswa-learn/github-action-workflows/.github/workflows/reusable.yaml@master
    with:
      name: ${{ inputs.name }}
    secrets:
      access-token: ${{ secrets.ACCESS_TOKEN }}
  calling-a-reusable-wf-in-the-same-repo:
    uses: ./.github/workflows/reusable-workflow.yaml
    # secrets:
    #   access-token: ${{ secrets.ACCESS_TOKEN }}   # Uncomment this if you want to pass the secret to the reusable workflow. If you don't pass the secret, then the reusable workflow will not have access to the secret. But if you pass the secret, then the reusable workflow will have access to the secret.
    secrets: inherit  # This will pass all the secrets from the calling workflow to the reusable workflow.
  using-reusable-wf-output:
    runs-on: ubuntu-latest
    needs: calling-a-reusable-wf-in-the-same-repo
    steps:
      - run: echo ${{ needs.calling-a-reusable-wf-in-the-same-repo.outputs.date }}