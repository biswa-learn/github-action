name: Expressions & Contexts
on: [push, pull_request, issues, workflow_dispatch]
run-name: "Expressions & Contexts by @${{ github.actor }}, event: ${{ github.event_name }}"
jobs:
    using-expressions-and-contexts:
        runs-on: ubuntu-latest
        steps:
            - name: Expressions
              id: expressions
              run: |
                  echo ${{ 1 }}
                  echo ${{ 'This is a string' }}
                  echo ${{ null }}
                  echo ${{ true }}
                  echo ${{ 1 > 2 }}
                  echo ${{ 'string' == 'String' }}
                  echo ${{ true && false }}
                  echo ${{ true || (false && true) }}
            - name: Dump Contexts
              run: |
                  echo 'GITHUB CONTEXT'
                  echo '${{ toJson(github) }}'
                  echo 'JOB CONTEXT'
                  echo '${{ toJson(job) }}'
                  echo 'RUNNER CONTEXT (SECRETS)'
                  echo '${{ toJson(secrets) }}'
                  echo 'STEPS CONTEXT'
                  echo '${{ toJson(steps) }}'
                  echo 'ENV CONTEXT'
                  echo '${{ toJson(runner) }}'
